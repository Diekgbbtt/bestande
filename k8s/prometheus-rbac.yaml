apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: bestande
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
- apiGroups: [""]
  resources: ["nodes", "pods", "endpoints", "services"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: bestande
---
apiVersion: v1
kind: Secret
metadata:
  name: prometheus-token
  namespace: bestande
  annotations:
    kubernetes.io/service-account.name: prometheus
type: kubernetes.io/service-account-token
