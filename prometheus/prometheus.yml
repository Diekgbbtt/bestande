global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

rule_files:
  - "rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['localhost:9093']
scrape_configs:

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: nodejs_app
    metrics_path: /metrics
    scheme: http
      #tls_config:
      #insecure_skip_verify: true
    static_configs:
      - targets: ['localhost:3002','172.23.205.204:3002']

  - job_name: mongodb
    static_configs:
      - targets: ['localhost:9216','172.23.205.204:9216']

  - job_name: node
    static_configs:
      - targets: ['localhost:9100','172.23.205.204:9100']
  - job_name: nginx_mtail
    static_configs:
      - targets: ['localhost:3903']
  - job_name: blackbox_ssl
    metrics_path: /probe
    tls_config:
      insecure_skip_verify: true
    params:
      module: [https_cert]
    static_configs:
      - targets:
        - https://staging.bestande.ch/health
        - https://172.23.205.204/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: localhost:9115
