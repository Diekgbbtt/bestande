global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

rule_files:
  - "rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['localhost:9093']
scrape_configs:

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: nodejs_app
    metrics_path: /metrics
    scheme: http
    kubernetes_sd_configs:
    - role: pod
      kubeconfig_file: /etc/prometheus/kubeconfig
      namespaces:
        names:
        - bestande
    relabel_configs:
    # Keep only pods annotated for scraping
    - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
      action: keep
      regex: "true"
    # Override metrics path from annotation if present
    - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
      action: replace
      target_label: __metrics_path__
      regex: (.+)
    # Rewrite address to pod_ip:annotation_port
    - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
      action: replace
      regex: ([^:]+)(?::\d+)?;(\d+)
      replacement: $1:$2
      target_label: __address__
    # Add informational labels for dashboards
    - source_labels: [__meta_kubernetes_pod_name]
      target_label: pod
    - source_labels: [__meta_kubernetes_namespace]
      target_label: namespace
    - source_labels: [__meta_kubernetes_pod_node_name]
      target_label: node

  - job_name: kube_state_metrics
    static_configs:
      - targets: ['localhost:30808']

  - job_name: mongodb
    static_configs:
      - targets: ['localhost:9216','172.23.205.204:9216']

  - job_name: node
    static_configs:
      - targets: ['localhost:9100','172.23.205.204:9100']
  - job_name: nginx_mtail
    static_configs:
      - targets: ['localhost:3903']
  - job_name: blackbox_ssl
    metrics_path: /probe
    tls_config:
      insecure_skip_verify: true
    params:
      module: [https_cert]
    static_configs:
      - targets:
        - https://staging.bestande.ch/health
        - https://172.23.205.204/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: localhost:9115
