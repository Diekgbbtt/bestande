global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

external_labels:
  monitor: webapp-monitor

rule_files:
  - "rules/*.yml"

scrape_configs:

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: nodejs_app
    metrics_path: /metrics
    static_configs:
      - targets: ['localhost:3000']

  - job_name: node_exporter
    static_configs:
      - targets: ['localhost:9100']

  - job_name: mongodb
    static_configs:
      - targets: ['localhost:9216']

  - job_name: blackbox_ssl
    metrics_path: /probe
    params:
      module: [https_cert]
    static_configs:
      - targets:
        - https://staging.bestande.ch
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: localhost:9115
