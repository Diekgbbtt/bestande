apply plugin: "com.android.application"

import com.android.build.OutputFile

project.ext.react = [
    enableHermes: true
]


apply from: "../../node_modules/react-native/react.gradle"
apply from: "../../node_modules/@sentry/react-native/sentry.gradle"

def enableSeparateBuildPerCPUArchitecture = false

/**
 * Run Proguard to shrink the Java bytecode in release builds.
 */
def enableProguardInReleaseBuilds = false

def jscFlavor = 'org.webkit:android-jsc:+'

def enableHermes = project.ext.react.get("enableHermes", false);



android {
    ndkVersion "21.0.6352462"
    compileSdkVersion 30
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    defaultConfig {
        applicationId "bestande.bestande"
        minSdkVersion 21
        targetSdkVersion 30
        vectorDrawables.useSupportLibrary = true
        versionCode project.hasProperty('versionCode') ? project.property('versionCode') as int : 1
        versionName "5.0"
        ndk {
						// TODO check if this can be removed
            abiFilters "armeabi-v7a", "x86", "arm64-v8a", "x86_64"
        }
    }
    signingConfigs {
        release {
            storeFile file(MYAPP_RELEASE_STORE_FILE)
            storePassword MYAPP_RELEASE_STORE_PASSWORD
            keyAlias MYAPP_RELEASE_KEY_ALIAS
            keyPassword MYAPP_RELEASE_KEY_PASSWORD
        }
    }
    splits {
        abi {
            reset()
            enable enableSeparateBuildPerCPUArchitecture
            universalApk true
            include "armeabi-v7a", "x86", "arm64-v8a", "x86_64"
        }
    }
    buildTypes {
        release {
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile(
                    "proguard-android.txt"), "proguard-rules.pro"
            signingConfig signingConfigs.release
        }
    }
		flavorDimensions "mode"
		productFlavors {
				production {
					dimension "mode"
					manifestPlaceholders = [
						appIcon: "@drawable/logo_adjusted"
					]
				}
		}

    packagingOptions {
				pickFirst '**/x86_64/libjscexecutor.so'
				pickFirst '**/x86_64/libjsc.so'
				pickFirst '**/x86_64/libhermes.so'
				pickFirst '**/arm64-v8a/libjscexecutor.so'
				pickFirst '**/arm64-v8a/libjsc.so'
				pickFirst '**/arm64-v8a/libhermes.so'
        pickFirst '**/armeabi-v7a/libc++_shared.so'
        pickFirst '**/x86/libc++_shared.so'
        pickFirst '**/arm64-v8a/libc++_shared.so'
        pickFirst '**/x86_64/libc++_shared.so'
        pickFirst '**/x86/libjsc.so'
        pickFirst '**/armeabi-v7a/libjsc.so'
    }

}

dependencies {
    api fileTree(dir: "libs", include: ["*.jar"])
		implementation 'com.facebook.soloader:soloader:0.9.0+'
		implementation "com.facebook.react:react-native:+"
		implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.0.0"
		implementation(project(':react-native-maps')) {
						exclude group: 'com.android.support'
						exclude module: 'appcompat-v7'
						exclude module: 'support-v4'
		}
    implementation "androidx.core:core:1.0.0"
    implementation "androidx.vectordrawable:vectordrawable:1.0.0"
    api 'com.mcxiaoke.volley:library:1.0.19'
    api 'com.google.android.gms:play-services-base:16.1.0'
    api 'com.google.android.gms:play-services-maps:16.1.0'
    api 'com.google.maps.android:android-maps-utils:0.5'

    if (enableHermes) {
        def hermesPath = "../../node_modules/hermes-engine/android/";
        debugImplementation files(hermesPath + "hermes-debug.aar")
        releaseImplementation files(hermesPath + "hermes-release.aar")
    } else {
        implementation jscFlavor
    }
}

// Run this once to be able to run the application with BUCK
// puts all compile dependencies into folder libs for BUCK to use
task copyDownloadableDepsToLibs(type: Copy) {
  from configurations.compile
  into 'libs'
}

apply plugin: 'com.google.gms.google-services'
apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)
